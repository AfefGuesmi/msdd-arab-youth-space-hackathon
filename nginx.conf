server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Always fetch the entry files fresh, so a new build is picked up
    # as soon as the container is replaced.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    # SQLite for the browser is a .wasm file; make sure it is served with the
    # type browsers require for WebAssembly.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
